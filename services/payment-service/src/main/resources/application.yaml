server:
  port: 5010
spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3306/airlinq_payment_db
    username: root
    password: VGsql@25
  jpa:
    hibernate:
      ddl-auto: update

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

razorpay:
  key-id: ${RAZORPAY_KEY_ID}
  key-secret: ${RAZORPAY_KEY_SECRET}
  currency: INR
  callback-url: ${RAZORPAY_CALLBACK_URL}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true